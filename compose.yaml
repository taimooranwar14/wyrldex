# Local development database only. Bound to 127.0.0.1 so nothing else on your network can reach it.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: wyrldex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wyrldex
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wyrldex"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
